<!DOCTYPE html>

<meta charset="UTF-8" />

<title>Planet Tracker — delete account</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0e17;
    --card: #141828;
    --border: #262c42;
    --text: #e8eaf2;
    --muted: #9aa2b8;
    --accent: #6d5bff;
    --accent-text: #ffffff;
    --danger: #e5484d;
    --error: #ff6b6b;
    --success: #3ddc97;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Hiragino Sans", "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 480px; }
  .top {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
  }
  select {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
    font: inherit;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    margin-top: 16px;
  }
  h1 { font-size: 22px; margin: 0 0 8px; }
  h2 { font-size: 17px; margin: 0 0 6px; }
  p { font-size: 14px; line-height: 1.5; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  .hint { color: var(--muted); margin: 0 0 4px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin: 16px 0 6px;
  }
  input {
    width: 100%;
    background: #0e1220;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  #code { font-size: 22px; letter-spacing: 6px; text-align: center; }
  #confirm-body { overflow-wrap: anywhere; }
  button.primary, button.danger {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    border: none;
    border-radius: 10px;
    color: var(--accent-text);
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  button.primary { background: var(--accent); }
  button.danger { background: var(--danger); }
  button:disabled { opacity: 0.6; cursor: default; }
  .links { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-top: 14px; }
  button.link {
    background: none;
    border: none;
    padding: 4px 0;
    color: var(--accent);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    text-decoration: underline;
  }
  .msg {
    margin-top: 16px;
    font-size: 14px;
    line-height: 1.5;
    padding: 12px 14px;
    border-radius: 10px;
    display: none;
  }
  .msg.info { display: block; background: rgba(109, 91, 255, 0.1); border: 1px solid rgba(109, 91, 255, 0.35); }
  .msg.success { display: block; background: rgba(61, 220, 151, 0.1); border: 1px solid rgba(61, 220, 151, 0.35); color: var(--success); }
  .msg.error { display: block; background: rgba(255, 107, 107, 0.1); border: 1px solid rgba(255, 107, 107, 0.35); color: var(--error); }
  footer { margin: 20px auto 0; text-align: center; color: var(--muted); font-size: 12px; }
</style>
</head>

  <div class="wrap">
    <div class="top">
      <label for="lang" data-i18n="language" style="margin:0;font-weight:400"></label>
      <select id="lang"></select>
    </div>

    <div class="card">
      <h1 data-i18n="pageTitle"></h1>
      <p class="lead" data-i18n="inApp"></p>

      <section id="step-email">
        <h2 data-i18n="step1Title"></h2>
        <p class="hint" data-i18n="step1Hint"></p>
        <form id="email-form" novalidate>
          <label for="email" data-i18n="email"></label>
          <input type="email" id="email" autocomplete="email" required />
          <button type="submit" class="primary" id="send-btn" data-i18n="sendCode"></button>
        </form>
      </section>

      <section id="step-code" hidden>
        <p class="msg info" data-i18n="codeSent"></p>
        <form id="code-form" novalidate>
          <label for="code" data-i18n="codeLabel"></label>
          <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" />
          <button type="submit" class="primary" id="verify-btn" data-i18n="confirmCode"></button>
        </form>
        <div class="links">
          <button type="button" class="link" id="resend-btn" data-i18n="resend"></button>
          <button type="button" class="link" id="other-email-btn" data-i18n="otherEmail"></button>
        </div>
      </section>

      <section id="step-confirm" hidden>
        <h2 data-i18n="confirmTitle"></h2>
        <p id="confirm-body"></p>
        <p class="hint" data-i18n="billingNotice"></p>
        <button type="button" class="danger" id="delete-btn" data-i18n="deleteButton"></button>
      </section>

      <section id="step-done" hidden>
        <p class="msg success" data-i18n="success"></p>
        <p class="hint" data-i18n="successHint"></p>
      </section>

      <div class="msg" id="msg" role="alert" aria-live="polite"></div>
    </div>
    <footer>Planet Tracker · planet-tracer.com</footer>
  </div>

        step1Hint: 'アカウントのメールアドレスを入力してください。確認コードをお送りします。パスワードは不要です。',

        confirmBody: 'アカウント：{email}。アカウント、プロフィール、クラウドに保存されたすべてのチャートが削除されます。この操作は取り消せません。',
        billingNotice: 'アカウントを削除しても Google Play の定期購入は解約されません。Google Play で解約してください。法律で必要な場合、支払い記録は保管されることがあります。',
        deleteButton: '完全に削除', deleting: '削除中…',
        success: 'アカウントを削除しました。',

        failed: 'アカウントを削除できませんでした。もう一度お試しください。',
        rateLimited: '試行回数が多すぎます。数分待ってから、もう一度お試しください。',
        network: 'サーバーに接続できません。インターネット接続を確認して、もう一度お試しください。',
        invalidEmail: '有効なメールアドレスを入力してください。',
      },
    };
    const ORDER = ['en', 'ru', 'uk', 'zh', 'es', 'fr', 'de', 'it', 'ptBr', 'pl', 'tr', 'id', 'ja'];
    const HTML_LANG = { ptBr: 'pt-BR', zh: 'zh-Hans' };

    // Only the client-safe publishable key, the same one compiled into the app.
    // Never put a secret or service-role key here.
    const SUPABASE_URL = 'https://bslufvtkbnsqykriycdx.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_z8vU_vCeYq6CbzdegZVAzw_a_q_T0KZ';
    const RESEND_COOLDOWN_MS = 60000;

    const $ = (id) => document.getElementById(id);
    const langSelect = $('lang');
    const msg = $('msg');
    let lang = 'en';
    let currentEmail = '';
    let msgKey = null;
    let busy = null;

    function fromTag(tag) {
      const t = String(tag).toLowerCase();
      if (t.startsWith('pt')) return 'ptBr';
      if (t === 'in' || t.startsWith('in-')) return 'id';
      const base = t.split('-')[0];
      return ORDER.includes(base) ? base : null;
    }

    function initialLang() {
      const q = new URLSearchParams(location.search).get('lang');
      if (q) {
        const l = ORDER.includes(q) ? q : fromTag(q);
        if (l) return l;
      }
      try {
        const saved = localStorage.getItem('planet-tracker-lang');
        if (saved && ORDER.includes(saved)) return saved;
      } catch {}
      for (const tag of navigator.languages || [navigator.language || 'en']) {
        const l = fromTag(tag);
        if (l) return l;
      }
      return 'en';
    }

    function render() {
      const S = T[lang];
      document.documentElement.lang = HTML_LANG[lang] || lang;
      document.title = S.pageTitle;
      for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = S[el.dataset.i18n];
      $('confirm-body').textContent = S.confirmBody.replace('{email}', currentEmail);
      if (busy) busy.button.textContent = S[busy.key];
      if (msgKey) msg.textContent = S[msgKey];
    }

    function setLang(l) {
      lang = l;
      langSelect.value = l;
      try { localStorage.setItem('planet-tracker-lang', l); } catch {}
      render();
    }

    function show(key, kind) {
      msgKey = key;
      msg.className = 'msg ' + kind;
      msg.textContent = T[lang][key];
    }

    function clearMsg() {
      msgKey = null;
      msg.className = 'msg';
      msg.textContent = '';
    }

    function step(id) {
      for (const s of ['step-email', 'step-code', 'step-confirm', 'step-done']) $(s).hidden = s !== id;
    }

    function setBusy(button, key) {
      for (const b of document.querySelectorAll('button')) b.disabled = true;
      busy = { button, key };
      button.textContent = T[lang][key];
    }

    function clearBusy() {
      busy = null;
      for (const b of document.querySelectorAll('button')) b.disabled = false;
      render();
    }

    // Rate limits and lost connections are shown as such; every other answer
    // to "send a code" looks the same, so the page never tells anyone which
    // emails have an account.
    function problem(error) {
      if (!error) return null;
      if (error.status === 429 || /rate_limit/i.test(error.code || '')) return 'rateLimited';
      if (!error.status || error.name === 'AuthRetryableFetchError') return 'network';
      return 'other';
    }

    let resendTimer = null;
    function startResendCooldown() {
      const btn = $('resend-btn');
      btn.hidden = true;
      clearTimeout(resendTimer);
      resendTimer = setTimeout(() => { btn.hidden = false; }, RESEND_COOLDOWN_MS);
    }

    for (const l of ORDER) {
      const o = document.createElement('option');
      o.value = l;
      o.textContent = T[l].languageName;
      langSelect.append(o);
    }
    langSelect.addEventListener('change', () => setLang(langSelect.value));
    setLang(initialLang());

    let supabase = null;
    try {
      const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2.116.0');
      supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
      });
    } catch {
      show('network', 'error');
    }

    async function sendCode() {
      const { error } = await supabase.auth.signInWithOtp({
        email: currentEmail,
        options: { shouldCreateUser: false },
      });
      const p = problem(error);
      if (p === 'rateLimited' || p === 'network') {
        show(p, 'error');
        return false;
      }
      return true;
    }

    $('email-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      clearMsg();
      if (!supabase) return show('network', 'error');
      const email = $('email').value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return show('invalidEmail', 'error');
      currentEmail = email;
      setBusy($('send-btn'), 'sending');
      const ok = await sendCode();
      clearBusy();
      if (!ok) return;
      $('code').value = '';
      step('step-code');
      startResendCooldown();
      $('code').focus();
    });

    $('resend-btn').addEventListener('click', async () => {
      clearMsg();
      setBusy($('resend-btn'), 'sending');
      const ok = await sendCode();
      clearBusy();
      if (ok) startResendCooldown();
    });

    $('other-email-btn').addEventListener('click', () => {
      clearMsg();
      currentEmail = '';
      step('step-email');
      $('email').focus();
    });

    $('code-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      clearMsg();
      const token = $('code').value.replace(/\D/g, '');
      if (token.length < 6) return show('wrongCode', 'error');
      setBusy($('verify-btn'), 'checking');
      const { data, error } = await supabase.auth.verifyOtp({ email: currentEmail, token, type: 'email' });
      clearBusy();
      const p = problem(error);
      if (p === 'rateLimited' || p === 'network') return show(p, 'error');
      if (error || !data?.session) return show('wrongCode', 'error');
      render();
      step('step-confirm');
    });

    $('delete-btn').addEventListener('click', async () => {
      clearMsg();
      setBusy($('delete-btn'), 'deleting');
      const { error } = await supabase.rpc('delete_user_account');
      clearBusy();
      if (error) return show(problem(error) === 'network' ? 'network' : 'failed', 'error');
      try { await supabase.auth.signOut({ scope: 'local' }); } catch {}
      step('step-done');
    });
  </script>
